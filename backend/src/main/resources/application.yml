server:
  port: 8085

spring:
  application:
    name: daiva-cosmetics-ecommerce
  servlet:
    multipart:
      enabled: true
      max-file-size: 30MB
      max-request-size: 60MB
  datasource:
    url: jdbc:h2:file:./data/cosmeticsdb;DB_CLOSE_DELAY=-1;FILE_LOCK=NO
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

zoho:
  accounts-url: "${ZOHO_ACCOUNTS_URL:https://accounts.zoho.in}"
  inventory-url: "${ZOHO_INVENTORY_URL:https://www.zohoapis.in/inventory/v1}"
  client-id: "${ZOHO_CLIENT_ID:}"
  client-secret: "${ZOHO_CLIENT_SECRET:}"
  refresh-token: "${ZOHO_REFRESH_TOKEN:}"
  organization-id: "${ZOHO_ORGANIZATION_ID:}"

razorpay:
  key-id: "${RAZORPAY_KEY_ID:rzp_test_mock_daiva}"
  key-secret: "${RAZORPAY_KEY_SECRET:mock_secret_daiva_beauty_2026}"
  webhook-secret: "${RAZORPAY_WEBHOOK_SECRET:whsec_daiva_beauty_2026}"
  currency: "INR"
  company-name: "Aura Luxe Cosmetics"

xpressbees:
  base-url: "${XPRESSBEES_BASE_URL:https://shipment.xpressbees.com}"
  email: "${XPRESSBEES_EMAIL:}"
  password: "${XPRESSBEES_PASSWORD:}"
  origin-pincode: "${XPRESSBEES_ORIGIN_PINCODE:560001}"
  warehouse-name: "${XPRESSBEES_WAREHOUSE_NAME:Aura Luxe Cosmetics Hub}"
  warehouse-line1: "${XPRESSBEES_WAREHOUSE_LINE1:124, 4th Cross, Indiranagar}"
  warehouse-city: "${XPRESSBEES_WAREHOUSE_CITY:Bengaluru}"
  warehouse-state: "${XPRESSBEES_WAREHOUSE_STATE:Karnataka}"
  warehouse-phone: "${XPRESSBEES_WAREHOUSE_PHONE:+91 9876543210}"
  tracking-url-template: "https://shipmentv2.xpressbees.com/orders/tracking/{awb}"

telegram:
  bot-token: "${TELEGRAM_BOT_TOKEN:}"
  chat-id: "${TELEGRAM_CHAT_ID:}"



